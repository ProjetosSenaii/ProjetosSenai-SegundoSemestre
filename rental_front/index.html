<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rental Eventos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Rental Eventos</h1>

            <p class="subtitulo">
                Organize seu evento com facilidade.
            </p>

            <!-- LOGIN -->
            <div id="loginArea">

                <h2>Entrar</h2>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Seu e-mail"
                >

                <input
                    type="password"
                    id="loginSenha"
                    placeholder="Sua senha"
                >

                <button onclick="fazerLogin()">
                    Entrar
                </button>

                <p>
                    Ainda não possui uma conta?
                    <button class="link" onclick="mostrarCadastro()">
                        Cadastre-se
                    </button>
                </p>

            </div>

            <div id="cadastroArea" class="hidden">

                <h2>Criar conta</h2>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Seu e-mail"
                >

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                >

                <button onclick="cadastrar()">
                    Cadastrar
                </button>

                <p>
                    Já possui uma conta?
                    <button class="link" onclick="mostrarLogin()">
                        Fazer login
                    </button>
                </p>

            </div>

            <p id="mensagem"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
